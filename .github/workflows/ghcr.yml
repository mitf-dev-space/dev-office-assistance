# Build and push Docker images to GitHub Container Registry (GHCR).
#
# Auth: GITHUB_TOKEN (packages: write). Login uses github.actor.
# Optional variable: DOCKER_VITE_API_BASE_URL (LAN default http://10.100.235.21:46811)

name: GHCR

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/mitf-dev-space

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: dev-office-assistance-api
            context: .
            file: apps/api/Dockerfile
          - image: dev-office-assistance-web
            context: .
            file: apps/web/Dockerfile
            web: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ format('{0}/{1}', env.REGISTRY, matrix.image) }}
          tags: |
            type=sha,prefix=,format=long
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILDKIT: "1"
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            GIT_SHA=${{ github.sha }}
            IMAGE_VERSION=${{ github.ref_name }}
            ${{ matrix.web == true && format('VITE_API_BASE_URL={0}', vars.DOCKER_VITE_API_BASE_URL || 'http://10.100.235.21:46811') || '' }}
          cache-from: type=registry,ref=${{ format('{0}/{1}:latest', env.REGISTRY, matrix.image) }}
          cache-to: type=inline,mode=max

      - name: Image digest summary
        run: |
          echo "### ${{ matrix.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tags: ${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
